name: Terraform

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.5"
  GCP_PROJECT_ID: alejoavila-web
  WIF_PROVIDER: projects/1027646897233/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  TF_SERVICE_ACCOUNT: terraform-admin@alejoavila-web.iam.gserviceaccount.com

jobs:
  verify:
    name: Format, validate and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate application layer
        working-directory: envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate bootstrap layer
        working-directory: envs/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Security scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

  bootstrap-guard:
    name: Flag bootstrap changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Warn when the bootstrap layer changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^envs/bootstrap/'; then
            echo "::warning::This PR changes envs/bootstrap. CI does not apply that layer — run 'terraform apply' locally after merging, or the deployment will drift from the code."
          else
            echo "No changes under envs/bootstrap."
          fi

  plan:
    name: Plan
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.TF_SERVICE_ACCOUNT }}

      - name: Plan application layer
        id: plan
        working-directory: envs/prod
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          echo "summary=$(grep -E '^Plan:|^No changes' plan.txt | head -1)" >> "$GITHUB_OUTPUT"

      - name: Comment plan on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/prod/plan.txt', 'utf8');
            const excerpt = plan.length > 60000 ? plan.slice(-60000) : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan\n\n\`${{ steps.plan.outputs.summary }}\`\n\n<details><summary>Full plan</summary>\n\n\`\`\`\n${excerpt}\n\`\`\`\n\n</details>`
            });

  apply:
    name: Apply
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: infraestructura
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.TF_SERVICE_ACCOUNT }}

      - name: Apply application layer
        working-directory: envs/prod
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
