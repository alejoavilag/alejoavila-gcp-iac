name: Terraform

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.5"
  PROJECT_ID: alejoavila-web
  WIF_PROVIDER: projects/1027646897233/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  TF_SA: terraform-admin@alejoavila-web.iam.gserviceaccount.com

jobs:
  verificar:
    name: Formato, validacion y escaneo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formato
        run: terraform fmt -check -recursive -diff

      - name: Validar capa de aplicacion
        working-directory: envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validar capa de bootstrap
        working-directory: envs/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Escaneo de seguridad
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

  plan:
    name: Plan
    needs: verificar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.TF_SA }}

      - name: Plan de la capa de aplicacion
        id: plan
        working-directory: envs/prod
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          echo "resumen=$(grep -E '^Plan:|^No changes' plan.txt | head -1)" >> "$GITHUB_OUTPUT"

      - name: Comentar el plan en el PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/prod/plan.txt', 'utf8');
            const recorte = plan.length > 60000 ? plan.slice(-60000) : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Plan de Terraform\n\n\`${{ steps.plan.outputs.resumen }}\`\n\n<details><summary>Ver plan completo</summary>\n\n\`\`\`\n${recorte}\n\`\`\`\n\n</details>`
            });

  apply:
    name: Aplicar
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: infraestructura
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.TF_SA }}

      - name: Aplicar capa de aplicacion
        working-directory: envs/prod
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
